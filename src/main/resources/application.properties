spring.application.name=portal
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
server.servlet.context-path=/portal/api

spring.datasource.url=jdbc:mysql://localhost:3306/mysql?zeroDateTimeBehavior=CONVERT_TO_NULL
spring.datasource.username=root
spring.datasource.password=mysql

jwt.expiration=49000000
jwt.secret=7A25432A462D4A614E645267556A586E3272357538782F413F4428472B4B6250



# ===== Evidencias =====
# Carpeta FUERA del proyecto (se crea sola al arrancar)
app.storage.evidencias-dir=C:/portal-fpune/evidencias
# M\u00e1ximo por archivo: 5 MB (5 * 1024 * 1024)
app.storage.max-bytes=5242880

# L\u00edmites de Spring para la subida (un poco m\u00e1s altos que el de arriba)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=30MB
# Para que Tomcat devuelva el error 413 en vez de cortar la conexi\u00f3n
server.tomcat.max-swallow-size=-1